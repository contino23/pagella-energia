<!-- @dsCard group="Voti" height=150 subtitle="Voto buono e voto insufficiente" -->
<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Voto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>body{margin:0;background:var(--surface)}</style></head>
<body>
<div class="pe" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:16px;max-width:560px">
  <div style="display:flex;flex-direction:column;gap:10px">
    <span><span class="pe-grade pe-grade-warn" style="font-size:40px">4,3</span><span class="pe-grade-of">/10</span></span>
    <div class="pe-meter" role="img" aria-label="Voto 4,3 su 10"><div class="pe-meter-fill warn" style="width:43%"></div></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <span><span class="pe-grade pe-grade-good" style="font-size:40px">9,9</span><span class="pe-grade-of">/10</span></span>
    <div class="pe-meter" role="img" aria-label="Voto 9,9 su 10"><div class="pe-meter-fill good" style="width:99%"></div></div>
  </div>
</div>
</body>
</html>
