<html lang="it">
<head><meta charset="utf-8"><title>Grafico indice</title>

<body>
<div class="pe" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:16px;max-width:760px">

  </div>
</div>

</html>
