<html lang="it">
<head><meta charset="utf-8"><title>Selettore luce e gas</title>

<style>body{margin:0;background:var(--surface)}</style></head>
<body>
<div class="pe" style="display:flex;flex-direction:column;gap:14px;padding:16px;max-width:360px">
