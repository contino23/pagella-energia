# Costruisce il sito dai dati del repository e lo pubblica su GitHub Pages.
name: Sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dati per il sito
        run: npm run dati-web
      - name: Costruisci
        run: npm run sito
        env:
          BASE_PATH: /
          SITE_URL: https://pagellaenergia.it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
